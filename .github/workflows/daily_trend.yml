name: Daily Hugging Face Trends

on:
  schedule:
    # 毎日UTC 3:00に実行（日本時間 JST は UTC+9 なので、3+9 = 12:00（正午））
    - cron: '0 3 * * *'
  workflow_dispatch: # ボタンを押して手動でいつでも実行できるようにする設定

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # 1. リポジトリのコードをチェックアウト
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Python環境のセットアップ
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. 必要なライブラリ（requests）のインストール
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    # 4. Pythonスクリプトの実行（trending.mdが生成される）
    - name: Run Scraper
      run: python fetch_trending.py

    # 5. 生成された変更をリポジトリにコミットしてプッシュ
    - name: Commit and Push changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add trending.md
        # 変更がない場合はエラーにせず正常終了させる
        git commit -m "Update trending models: $(date +'%Y-%m-%d')" || exit 0
        git push
